apiVersion: v1
data:
  policy: |-
    {
      "minLength": "8",
      "maxLength": "32",
      "uppercaseCount": "1",
      "lowercaseCount": "1",
      "minNum": "1",
      "special": "1",
      "symbol": "(!@#$%^&*(-_=+\\\\|[{}];:', <.>/?)",
      "errorMessage": "비밀번호에는 숫자 1개 이상, 소문자 1개 이상, 대문자 1개 이상, 특수 문자 1개 이상((!@#$%^&*(-_=+\\\\|[{}];:', <.>/?))이(가) 포함되어야 합니다. 길이는 8자에서 32자 사이여야 합니다."
    }
kind: ConfigMap
metadata:
  name: password-policy-config
  namespace: default
