{{- if .Values.authentik.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "authentik.fullname" . }}
  namespace: {{ include "authentik.namespace" . | quote }}
  labels:
    {{- include "authentik.labels" (dict "context" .) | nindent 4 }}
  {{- if .Values.global.secretAnnotations }}
  annotations:
    {{- toYaml .Values.global.secretAnnotations | nindent 4 }}
  {{- end }}
data:
  {{- include "authentik.env" (dict "root" . "values" .Values.authentik) | indent 2 }}
  {{- if not .Values.authentik.secret_key }}
  {{- /* authentik.env skips empty values, so AUTHENTIK_SECRET_KEY is handled here: keep the
       key an existing release already uses (rotating it invalidates every session), and
       generate one on first install instead of shipping a well-known default. */}}
  {{- $existing := lookup "v1" "Secret" (include "authentik.namespace" .) (include "authentik.fullname" .) }}
  {{- if and $existing $existing.data (index $existing.data "AUTHENTIK_SECRET_KEY") }}
  AUTHENTIK_SECRET_KEY: {{ index $existing.data "AUTHENTIK_SECRET_KEY" | quote }}
  {{- else }}
  AUTHENTIK_SECRET_KEY: {{ randAlphaNum 50 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.geoip.enabled (not .Values.geoip.existingSecret.secretName) }}
  GEOIPUPDATE_ACCOUNT_ID: {{ required "geoip account id required" .Values.geoip.accountId | b64enc | quote }}
  GEOIPUPDATE_LICENSE_KEY: {{ required "geoip license key required" .Values.geoip.licenseKey | b64enc | quote }}
  {{- end }}
{{- end }}
